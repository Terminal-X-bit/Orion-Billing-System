# Orion dashboard — nginx config for the containerized deployment.
#
# Two jobs:
#   1. Serve the built SPA with an index.html fallback (React Router-free app
#      uses in-page tabs, but the fallback also covers deep links and hard
#      refreshes).
#   2. Proxy /portal* to the bridge so guests and operators share one origin —
#      that shared origin is what lets the dashboard's portal reachability
#      pill and the guest portal live on the same host without CORS setup.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Basic hardening headers ---------------------------------------------
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin always;

  # --- Static assets: hashed filenames, cache hard -------------------------
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # --- Captive portal + portal assets -> bridge ----------------------------
  # Only these paths are exposed to guests; everything else hits the SPA.
  location /portal {
    proxy_pass http://bridge:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Guests log in via the router's login page POSTs; keep request bodies.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Portal's demo payments simulate a websocket-ish polling loop; harmless
    # to include upgrade headers for future portal real-time needs.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # --- SPA ------------------------------------------------------------------
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

